<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天吃什麼？隨機抽籤機 🍕</title>
    
    <!-- 載入 Google 字型與 FontAwesome 圖示 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Canvas Confetti 慶祝特效庫 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --primary-yellow: #FFD54F;
            --primary-orange: #FF9800;
            --dark-orange: #F57C00;
            --accent-red: #FF5722;
            --light-bg: #FFF8E7;
            --card-bg: #FFFFFF;
            --text-color: #5D4037;
            --shadow-color: rgba(255, 152, 0, 0.25);
            --radius-lg: 32px;
            --radius-md: 20px;
            --radius-sm: 14px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Zen Maru Gothic', 'Fredoka', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #FFF3E0 0%, #FFE082 50%, #FFB74D 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-color);
            position: relative;
            overflow-x: hidden;
        }

        /* 飄浮背景裝飾 */
        .bg-decorations .bubble {
            position: absolute;
            font-size: 2.2rem;
            opacity: 0.25;
            user-select: none;
            animation: floatAround 10s infinite ease-in-out alternate;
        }

        .bubble-1 { top: 8%; left: 8%; animation-delay: 0s; }
        .bubble-2 { top: 15%; right: 10%; animation-delay: 2s; }
        .bubble-3 { bottom: 12%; left: 10%; animation-delay: 4s; }
        .bubble-4 { bottom: 18%; right: 8%; animation-delay: 1s; }
        .bubble-5 { top: 50%; left: 3%; animation-delay: 3s; }
        .bubble-6 { top: 52%; right: 4%; animation-delay: 5s; }

        @keyframes floatAround {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-18px) rotate(10deg); }
            100% { transform: translateY(12px) rotate(-10deg); }
        }

        /* 主卡片容器 */
        .main-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 440px;
            border-radius: var(--radius-lg);
            padding: 36px 28px;
            box-shadow: 0 20px 40px var(--shadow-color), 0 6px 12px rgba(0, 0, 0, 0.05);
            border: 5px solid #FFE082;
            position: relative;
            text-align: center;
            z-index: 10;
        }

        .top-badge {
            display: inline-block;
            background: #FFF3E0;
            color: var(--dark-orange);
            font-weight: 700;
            font-size: 0.9rem;
            padding: 6px 16px;
            border-radius: 20px;
            margin-bottom: 16px;
            border: 2px dashed #FFB74D;
        }

        .card-ear {
            width: 32px;
            height: 32px;
            background: var(--primary-yellow);
            border: 4px solid #FFE082;
            border-radius: 50%;
            position: absolute;
            top: -16px;
        }
        .ear-left { left: 40px; }
        .ear-right { right: 40px; }

        /* 標題與彈跳動畫 */
        .title-container {
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .main-title {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--primary-orange);
            text-shadow: 3px 3px 0px #FFE082, -1px -1px 0px #FFF;
            line-height: 1.3;
            word-break: break-word;
        }

        /* 生動彈跳動畫 (Pop Animation) */
        .bounce-pop {
            animation: popBounce 0.65s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popBounce {
            0% {
                opacity: 0;
                transform: scale(0.3) translateY(-20px) rotate(-5deg);
            }
            50% {
                transform: scale(1.15) translateY(5px) rotate(3deg);
            }
            75% {
                transform: scale(0.95) translateY(-2px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0) rotate(0deg);
            }
        }

        /* 食物圖片卡片 */
        .result-card {
            transition: all 0.4s ease;
            margin-bottom: 24px;
        }

        .result-card.hidden {
            display: none;
            opacity: 0;
        }

        .image-box {
            position: relative;
            width: 100%;
            height: 220px;
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 4px solid #FFE082;
            box-shadow: 0 8px 16px rgba(0,0,0,0.08);
            margin-bottom: 16px;
            background-color: #FFF8E7;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .image-box:hover img {
            transform: scale(1.05);
        }

        .image-tag {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(255, 255, 255, 0.92);
            color: var(--dark-orange);
            font-size: 0.85rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        /* 馬上出發導航按鈕 */
        .map-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: linear-gradient(135deg, #4CAF50 0%, #388E3C 100%);
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: var(--radius-sm);
            font-size: 1.1rem;
            font-weight: 700;
            box-shadow: 0 6px 16px rgba(76, 175, 80, 0.3);
            transition: all 0.2s ease;
        }

        .map-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(76, 175, 80, 0.4);
            background: linear-gradient(135deg, #66BB6A 0%, #43A047 100%);
        }

        .map-button:active {
            transform: translateY(1px);
        }

        /* 抽籤按鈕區 */
        .action-area {
            margin-top: 10px;
        }

        .draw-button {
            width: 100%;
            background: linear-gradient(135deg, #FFB74D 0%, #FF9800 50%, #FF5722 100%);
            color: white;
            border: none;
            padding: 16px 24px;
            font-size: 1.3rem;
            font-weight: 900;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px var(--shadow-color), 0 4px 0px #E65100;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .draw-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 24px var(--shadow-color), 0 6px 0px #E65100;
            background: linear-gradient(135deg, #FFA726 0%, #FB8C00 50%, #F4511E 100%);
        }

        .draw-button:active {
            transform: translateY(2px);
            box-shadow: 0 4px 10px var(--shadow-color), 0 2px 0px #E65100;
        }

        .sub-tip {
            margin-top: 14px;
            font-size: 0.85rem;
            color: #8D6E63;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- 背景動態飄浮食物元素 -->
    <div class="bg-decorations" aria-hidden="true">
        <span class="bubble bubble-1">🍔</span>
        <span class="bubble bubble-2">🍜</span>
        <span class="bubble bubble-3">🍱</span>
        <span class="bubble bubble-4">🍲</span>
        <span class="bubble bubble-5">🍰</span>
        <span class="bubble bubble-6">🍹</span>
    </div>

    <!-- 主卡片容器 -->
    <main class="main-card">
        <div class="top-badge">
            <i class="fa-solid fa-utensils"></i> 美食選擇困難救星
        </div>

        <div class="card-ear ear-left"></div>
        <div class="card-ear ear-right"></div>

        <!-- 標題區域 -->
        <header class="title-container">
            <h1 id="main-title" class="main-title">今天吃什麼？</h1>
        </header>

        <!-- 美食結果卡片區 -->
        <section id="result-card" class="result-card hidden">
            <div class="image-box">
                <img id="food-image" src="" alt="美食圖片" loading="lazy" onerror="this.src='https://placehold.co/600x400/FFF3E0/FF9800?text=Delicious+Food'">
                <div class="image-tag" id="food-category">推薦美食</div>
            </div>

            <!-- Google Maps 導航按鈕 -->
            <a id="map-btn" href="#" target="_blank" rel="noopener noreferrer" class="map-button">
                <i class="fa-solid fa-location-dot"></i>
                <span>馬上出發！</span>
                <i class="fa-solid fa-arrow-right"></i>
            </a>
        </section>

        <!-- 抽籤按鈕 -->
        <div class="action-area">
            <button id="draw-btn" class="draw-button">
                <span class="btn-icon"><i class="fa-solid fa-dice"></i></span>
                <span class="btn-text">點我抽籤</span>
            </button>
            <p class="sub-tip" id="sub-tip">👉 點擊按鈕，讓幸運轉盤幫你決定今天的美味吧！</p>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 指定的美食清單資料
            const foodList = [
                {
                    name: "鴨肉飯 🦆",
                    category: "古早味小吃",
                    image: "https://images.unsplash.com/photo-1514944288352-fffac99f0bdf?auto=format&fit=crop&w=700&q=80",
                    mapUrl: "https://www.google.com/maps/search/?api=1&query=鴨肉飯"
                },
                {
                    name: "深水食堂 🍱",
                    category: "溫馨日式定食",
                    image: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=700&q=80",
                    mapUrl: "https://www.google.com/maps/search/?api=1&query=深水食堂"
                },
                {
                    name: "THE-T-cafe ☕",
                    category: "輕食咖啡廳",
                    image: "https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&w=700&q=80",
                    mapUrl: "https://www.google.com/maps/search/?api=1&query=THE-T-cafe"
                },
                {
                    name: "栗の鍋 🍲",
                    category: "暖心小火鍋",
                    image: "https://images.unsplash.com/photo-1555126634-323283e090fa?auto=format&fit=crop&w=700&q=80",
                    mapUrl: "https://www.google.com/maps/search/?api=1&query=栗の鍋"
                },
                {
                    name: "越南河粉 🍜",
                    category: "異國酸辣美食",
                    image: "https://images.unsplash.com/photo-1582878826629-29b7ad1cdc43?auto=format&fit=crop&w=700&q=80",
                    mapUrl: "https://www.google.com/maps/search/?api=1&query=越南河粉"
                }
            ];

            const mainTitle = document.getElementById('main-title');
            const drawBtn = document.getElementById('draw-btn');
            const resultCard = document.getElementById('result-card');
            const foodImage = document.getElementById('food-image');
            const foodCategory = document.getElementById('food-category');
            const mapBtn = document.getElementById('map-btn');
            const subTip = document.getElementById('sub-tip');

            let isSpinning = false;

            // 音效模擬器 (Web Audio API 產生軟萌嗶嗶聲與成功慶祝音效)
            function playBeepSound(freq = 440, duration = 0.05) {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + duration);
                } catch (e) {
                    // 瀏覽器不支援 Web Audio 時靜音處理
                }
            }

            function playWinSound() {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        setTimeout(() => playBeepSound(freq, 0.15), idx * 80);
                    });
                } catch(e) {}
            }

            drawBtn.addEventListener('click', () => {
                if (isSpinning) return;
                isSpinning = true;

                // 1. 禁用按鈕樣式並更換文字
                drawBtn.disabled = true;
                drawBtn.style.opacity = '0.85';
                drawBtn.querySelector('.btn-text').textContent = '抽籤中...';

                // 2. 重置標題動畫類別
                mainTitle.classList.remove('bounce-pop');

                // 3. 轉動特效 (快速隨機切換文字)
                let counter = 0;
                const spinInterval = setInterval(() => {
                    const tempIndex = Math.floor(Math.random() * foodList.length);
                    mainTitle.textContent = foodList[tempIndex].name;
                    playBeepSound(400 + Math.random() * 200, 0.03);
                    counter++;

                    if (counter > 12) {
                        clearInterval(spinInterval);

                        // 4. 正式挑選目標美食
                        const finalIndex = Math.floor(Math.random() * foodList.length);
                        const selectedFood = foodList[finalIndex];

                        // 替換名稱並執行生動彈跳動畫
                        mainTitle.textContent = selectedFood.name;
                        void mainTitle.offsetWidth; // 觸發重繪以重新啟動 CSS 動畫
                        mainTitle.classList.add('bounce-pop');

                        // 播放慶祝音效與彩帶特效
                        playWinSound();
                        if (typeof confetti === 'function') {
                            confetti({
                                particleCount: 60,
                                spread: 70,
                                origin: { y: 0.65 },
                                colors: ['#FF9800', '#FFD54F', '#FF5722', '#4CAF50']
                            });
                        }

                        // 5. 更新美食圖片、分類與 Google Maps 連結
                        foodImage.src = selectedFood.image;
                        foodImage.alt = selectedFood.name;
                        foodCategory.textContent = selectedFood.category;
                        mapBtn.href = selectedFood.mapUrl;

                        // 6. 顯示結果區域
                        resultCard.classList.remove('hidden');

                        // 7. 恢復按鈕並可進行「再抽一次」
                        drawBtn.disabled = false;
                        drawBtn.style.opacity = '1';
                        drawBtn.querySelector('.btn-icon').innerHTML = '<i class="fa-solid fa-rotate-right"></i>';
                        drawBtn.querySelector('.btn-text').textContent = '再抽一次';
                        subTip.textContent = '🎉 抽到了！不滿意的話可以點擊「再抽一次」唷！';

                        isSpinning = false;
                    }
                }, 75);
            });
        });
    </script>
</body>
</html>
