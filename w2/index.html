<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天吃什麼？隨機抽籤機</title>
    <style>
        /* 全局樣式設定 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: #FFF9E6;
            background-image: radial-gradient(#FFE0B2 15%, transparent 16%);
            background-size: 20px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* 主卡片容器 */
        .card {
            background-color: #FFFFFF;
            border: 4px solid #FF9800;
            border-radius: 28px;
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 12px 24px rgba(255, 152, 0, 0.15);
        }

        /* 標題樣式 */
        .title {
            color: #E65100;
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 24px;
            min-height: 2.6em;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-all;
        }

        /* 動畫效果：生動彈跳 */
        .bounce {
            animation: popBounce 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popBounce {
            0% {
                transform: scale(0.3);
                opacity: 0;
            }
            50% {
                transform: scale(1.15);
            }
            70% {
                transform: scale(0.95);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* 隱藏元素標籤 */
        .hidden {
            display: none !important;
        }

        /* 結果展示區（圖片與地圖按鈕） */
        .result-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .image-wrapper {
            width: 100%;
            height: 200px;
            border-radius: 16px;
            overflow: hidden;
            border: 3px solid #FFE082;
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Google Map 按鈕 */
        .map-btn {
            display: inline-block;
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: #FFFFFF;
            font-size: 1rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 12px;
            box-shadow: 0 4px 0 #2E7D32;
            transition: transform 0.1s, background-color 0.2s;
        }

        .map-btn:hover {
            background-color: #43A047;
        }

        .map-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #2E7D32;
        }

        /* 大抽籤按鈕 */
        .draw-btn {
            width: 100%;
            padding: 16px;
            background-color: #FFB300;
            color: #5D4037;
            font-size: 1.4rem;
            font-weight: 800;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #FB8C00;
            transition: transform 0.1s, background-color 0.2s;
        }

        .draw-btn:hover {
            background-color: #FFC107;
        }

        .draw-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #FB8C00;
        }
    </style>
</head>
<body>

            <a id="map-btn" class="map-btn" href="#" target="_blank" rel="noopener noreferrer">
                📍 馬上出發 (Google Map)
            </a>

        <button id="draw-btn" class="draw-btn">點我抽籤 🎲</button>
    </main>
