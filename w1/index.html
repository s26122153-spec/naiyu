<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人數位名片</title>
    <style>
        /* 全域設定：清除預設邊距與設定字體 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* 頁面背景：淡燕麥奶色，並將名片完全垂直水平置中 */
        body {
            background-color: #f7f3ef;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 名片主體容器 */
        .card {
            background-color: #ffffff;
            width: 100%;
            max-width: 350px;
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            /* 現代感微陰影 */
            box-shadow: 0 10px 30px rgba(180, 160, 140, 0.15);
            transition: transform 0.3s ease;
        }

        /* 滑鼠懸停名片時微浮起效果 */
        .card:hover {
            transform: translateY(-5px);
        }

        /* 1. 圓形大頭貼照片 */
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 4px solid #ede3da; /* 淡淡奶茶色外框 */
        }

        /* 2. 名字 */
        .name {
            font-size: 24px;
            color: #4a3e3d; /* 深褐棕色 */
            margin-bottom: 8px;
            font-weight: 600;
        }

        /* 2. 自我介紹 */
        .bio {
            font-size: 14px;
            color: #8c7b75; /* 溫柔奶茶灰 */
            line-height: 1.5;
            margin-bottom: 30px;
        }

        /* 3. 按鈕區塊 */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 按鈕通用基礎樣式 */
        .btn {
            display: block;
            padding: 12px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        /* Instagram 按鈕：經典奶茶色 */
        .btn-ig {
            background-color: #c4a482;
            color: #ffffff;
        }

        .btn-ig:hover {
            background-color: #b39270;
        }

        /* Email 按鈕：淺奶茶色 */
        .btn-email {
            background-color: #f2e9e1;
            color: #6e5d54;
        }

        .btn-email:hover {
            background-color: #e5d8cc;
        }
    </style>
</head>
<body>

    <!-- 名片主要內容區塊 -->
    <div class="card">
        <!-- 1. 大頭貼 (可更換照片網址) -->
        <img src="https://picsum.photos/200" alt="大頭貼" class="avatar">
        
        <!-- 2. 名字與簡介 -->
        <h1 class="name">王小明</h1>
        <p class="bio">一名熱愛生活與視覺美學的 UI/UX 設計新手 🎨</p>
        
        <!-- 3. 按鈕 -->
        <div class="button-group">
            <a href="#" class="btn btn-ig" target="_blank">Instagram</a>
            <a href="mailto:your_email@example.com" class="btn btn-email">Email Me</a>
        </div>
    </div>

</body>
</html>
